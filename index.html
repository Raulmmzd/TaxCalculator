<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torpaq-Əmlak Vergisi Hesablayıcısı</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a7c66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vergi Hesab">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    background: linear-gradient(135deg, #eaf6f0 0%, #f7f3e8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #3b3b3b;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    color: #4a7c66;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #9a9a9a;
    margin-bottom: 24px;
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #5a5a5a;
  }

  input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid #dcecE4;
    background: #fbfdfc;
    font-size: 15px;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
  }

  input[type="number"]:focus {
    border-color: #8fc9ab;
    box-shadow: 0 0 0 3px rgba(143,201,171,0.2);
  }

  .results {
    margin-top: 8px;
    background: #f4faf6;
    border-radius: 14px;
    padding: 16px 18px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 6px 0;
    color: #5a5a5a;
  }

  .result-row span:last-child {
    font-weight: 600;
    color: #3b3b3b;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1.5px dashed #cfe6d9;
  }

  .total-row span:first-child {
    font-size: 15px;
    font-weight: 700;
    color: #4a7c66;
  }

  .total-row span:last-child {
    font-size: 22px;
    font-weight: 800;
    color: #d68a3c;
  }

  .manat {
    font-size: 14px;
    font-weight: 600;
    color: #9a9a9a;
    margin-left: 4px;
  }

  footer {
    text-align: center;
    margin-top: 22px;
    font-size: 11px;
    color: #b8b8b8;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Torpaq-Əmlak Vergisi</h1>
  <div class="subtitle">Hesablama avtomatik aparılır</div>

  <div class="field">
    <label for="emlak">Əmlakın sahəsi (kvadrat metr)</label>
    <input type="number" id="emlak" min="0" placeholder="məs: 130" oninput="hesabla()">
  </div>

  <div class="field">
    <label for="torpaq">Torpağın sahəsi (sot)</label>
    <input type="number" id="torpaq" min="0" placeholder="məs: 2" oninput="hesabla()">
  </div>

  <div class="results">
    <div class="result-row">
      <span>Vergi tutulan sahə (30 kv.m çıxılmaqla)</span>
      <span id="verginiSaheSi">0 kv.m</span>
    </div>
    <div class="result-row">
      <span>Əmlak vergisi</span>
      <span id="emlakVergi">0.00 ₼</span>
    </div>
    <div class="result-row">
      <span>Torpaq vergisi</span>
      <span id="torpaqVergi">0.00 ₼</span>
    </div>
    <div class="total-row">
      <span>Ümumi illik borc</span>
      <span id="umumiVergi">0.00 ₼</span>
    </div>
  </div>

  <footer>Created by Raul Mammadzada</footer>
</div>

<script>
function hesabla() {
  const emlakSahe = parseFloat(document.getElementById('emlak').value) || 0;
  const torpaqSahe = parseFloat(document.getElementById('torpaq').value) || 0;

  let vergiTutulanSahe = 0;
  let emlakVergi = 0;
  if (emlakSahe > 30) {
    vergiTutulanSahe = emlakSahe - 30;
    emlakVergi = vergiTutulanSahe * 0.32;
  }

  const torpaqVergi = torpaqSahe * 0.6;

  const umumi = emlakVergi + torpaqVergi;

  document.getElementById('verginiSaheSi').textContent = vergiTutulanSahe.toFixed(2) + ' kv.m';
  document.getElementById('emlakVergi').textContent = emlakVergi.toFixed(2) + ' ₼';
  document.getElementById('torpaqVergi').textContent = torpaqVergi.toFixed(2) + ' ₼';
  document.getElementById('umumiVergi').textContent = umumi.toFixed(2) + ' ₼';
}

hesabla();
</script>

</body>
</html>
